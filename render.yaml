# One-click hosting on Render (free): render.com → New → Blueprint → pick your GitHub repo.
services:
  - type: web
    name: supernatural-tower-defense
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: ADMIN_KEY
        generateValue: true # find it under Environment in the Render dashboard
